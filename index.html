<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9edf3">
  <title>memelser · Desarrollo en otra dimensión</title>
  <meta name="description" content="Portafolio de memelser / nglmercer. Desarrollador web, desktop y multiplataforma en Perú. Proyectos de streaming, Rust e integraciones.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2314243c'/%3E%3Cpath d='M8 28V12h5l7 9 7-9h5v16h-5V20l-7 8-7-8v8z' fill='%23e9edf3'/%3E%3C/svg%3E">
  <script>try { const theme = localStorage.getItem('memelser.theme') || 'light'; if (['lime','violet','cyan','ember','light'].includes(theme)) document.documentElement.dataset.theme = theme; } catch {}</script>
  <style>
    #app-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;gap:18px;background:#e9edf3;color:#14243c;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
    #app-loader.show{opacity:1;visibility:visible;transition:opacity .3s ease}
    #app-loader.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s .3s}
    #app-loader .loader-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:currentColor;font:600 1.9rem 'Space Grotesk',system-ui,sans-serif}
    #app-loader .loader-mark i{font-style:normal;color:#e9edf3}
    #app-loader .loader-name{font:600 1.05rem 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
    #app-loader .loader-bar{width:148px;height:3px;border-radius:2px;overflow:hidden;background:currentColor;opacity:.18;position:relative}
    #app-loader .loader-bar i{position:absolute;inset:0;width:40%;border-radius:2px;background:#244ee2;opacity:1;animation:loader-slide 1.1s ease-in-out infinite}
    @keyframes loader-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    html[data-theme=lime] #app-loader{background:#10110f;color:#f3f4ec}
    html[data-theme=lime] #app-loader .loader-mark i{color:#10110f}
    html[data-theme=lime] #app-loader .loader-bar i{background:#d0ff71}
    html[data-theme=violet] #app-loader{background:#111018;color:#f3effc}
    html[data-theme=violet] #app-loader .loader-mark i{color:#111018}
    html[data-theme=violet] #app-loader .loader-bar i{background:#c5acff}
    html[data-theme=cyan] #app-loader{background:#0b1419;color:#eef9fb}
    html[data-theme=cyan] #app-loader .loader-mark i{color:#0b1419}
    html[data-theme=cyan] #app-loader .loader-bar i{background:#70e0ee}
    html[data-theme=ember] #app-loader{background:#19110e;color:#fbf3eb}
    html[data-theme=ember] #app-loader .loader-mark i{color:#19110e}
    html[data-theme=ember] #app-loader .loader-bar i{background:#ffbd88}
    @media(prefers-reduced-motion:reduce){#app-loader .loader-bar i{animation:none;transform:none;width:100%}}
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-label="Loading portfolio">
    <div class="loader-mark" aria-hidden="true"><i>m.</i></div>
    <div class="loader-name" aria-hidden="true">memelser/</div>
    <div class="loader-bar" aria-hidden="true"><i></i></div>
  </div>
  <script>setTimeout(function(){var l=document.getElementById('app-loader');if(l)l.classList.add('show')},300)</script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
