<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project repository preview</title><style>
*{box-sizing:border-box}body{margin:0;padding:clamp(24px,5vw,60px);font:16px/1.6 system-ui,sans-serif;background:#14243c;color:#f4f7ff;min-height:100vh}header{display:flex;align-items:center;gap:12px;color:#c4d1e9;font-size:14px}.mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #8091ac;border-radius:8px}h1{font-size:clamp(30px,5vw,58px);line-height:1.12;letter-spacing:-.05em;margin:36px 0 20px;overflow-wrap:anywhere;font-weight:500}p{max-width:60ch;color:#c4d1e9;margin:0 0 28px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#263a58;border:1px solid #526883;color:#dbe9ff;font-size:14px;padding:5px 12px;border-radius:20px}.code{margin-top:32px;border:1px solid #435772;border-radius:12px;padding:20px;background:#0d1b2e;color:#acd8f6;font:14px/1.8 ui-monospace,monospace;overflow-wrap:anywhere}a{color:#94dcff;text-underline-offset:4px;font-size:14px}.foot{margin-top:28px;display:flex;gap:20px;flex-wrap:wrap}a:focus-visible{outline:3px solid #94dcff;outline-offset:4px}</style></head><body><header><span class="mark">&lt;/&gt;</span><span id="kind"></span></header><h1 id="name"></h1><p id="description" dir="auto"></p><div class="badges" id="badges"></div><div class="code" id="code"></div><div class="foot"><a id="repo" target="_blank" rel="noopener noreferrer">GitHub</a><a id="demo" target="_blank" rel="noopener noreferrer" hidden></a></div><script type="module">
const strings={"es":{"noDescription":"Sin descripción en GitHub.","repositoryView":"Vista del repositorio","forkLabel":"Fork","ownedLabel":"Propio","openProject":"Abrir proyecto","githubError":"No se pudieron cargar los datos."},"en":{"noDescription":"No description on GitHub.","repositoryView":"Repository view","forkLabel":"Fork","ownedLabel":"Owned","openProject":"Open project","githubError":"GitHub data could not be loaded."},"pt":{"noDescription":"Sem descrição no GitHub.","repositoryView":"Vista do repositório","forkLabel":"Fork","ownedLabel":"Próprio","openProject":"Abrir projeto","githubError":"Não foi possível carregar os dados."},"fr":{"noDescription":"Aucune description sur GitHub.","repositoryView":"Vue du dépôt","forkLabel":"Fork","ownedLabel":"Personnel","openProject":"Ouvrir le projet","githubError":"Impossible de charger les données."},"de":{"noDescription":"Keine Beschreibung auf GitHub.","repositoryView":"Repository-Ansicht","forkLabel":"Fork","ownedLabel":"Eigenes Projekt","openProject":"Projekt öffnen","githubError":"Daten konnten nicht geladen werden."},"zh":{"noDescription":"GitHub 上没有描述。","repositoryView":"仓库视图","forkLabel":"Fork","ownedLabel":"自有","openProject":"打开项目","githubError":"无法加载数据。"},"ja":{"noDescription":"GitHub に説明はありません。","repositoryView":"リポジトリ表示","forkLabel":"Fork","ownedLabel":"所有","openProject":"プロジェクトを開く","githubError":"データを読み込めませんでした。"},"ko":{"noDescription":"GitHub 설명이 없습니다.","repositoryView":"저장소 보기","forkLabel":"Fork","ownedLabel":"소유","openProject":"프로젝트 열기","githubError":"데이터를 불러올 수 없습니다."},"ar":{"noDescription":"لا يوجد وصف على GitHub.","repositoryView":"عرض المستودع","forkLabel":"Fork","ownedLabel":"مملوك","openProject":"فتح المشروع","githubError":"تعذر تحميل البيانات."},"hi":{"noDescription":"GitHub पर विवरण नहीं है।","repositoryView":"रिपॉजिटरी दृश्य","forkLabel":"Fork","ownedLabel":"स्वामित्व","openProject":"प्रोजेक्ट खोलें","githubError":"डेटा लोड नहीं हो सका।"}};
const params=new URLSearchParams(location.search),locale=params.get('lang')||'es',copy=strings[locale]||strings.es;document.documentElement.lang=locale;document.documentElement.dir=locale==='ar'?'rtl':'ltr';
try{let data;try{data=await fetch('/api/github').then(r=>{if(!r.ok)throw Error();return r.json();});}catch{data=await fetch('/github-data.json').then(r=>r.json());}const repo=data.repos.find(r=>String(r.id)===params.get('id'));if(!repo)throw Error();document.title=repo.name;document.getElementById('name').textContent=repo.name;document.getElementById('description').textContent=repo.description||copy.noDescription;document.getElementById('kind').textContent=copy.repositoryView+' / '+repo.fullName;const badges=[repo.language,...repo.topics.slice(0,6),repo.isFork?copy.forkLabel:copy.ownedLabel].filter(Boolean);for(const text of badges){const span=document.createElement('span');span.className='badge';span.textContent=text;document.getElementById('badges').append(span);}document.getElementById('code').textContent='git clone '+repo.url+'.git';document.getElementById('repo').href=repo.url;if(repo.homepage&&/^https:\/\//.test(repo.homepage)){const link=document.getElementById('demo');link.hidden=false;link.href=repo.homepage;link.textContent=copy.openProject;}}catch{document.getElementById('description').textContent=copy.githubError;}
</script></body></html>
